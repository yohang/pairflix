version: 2

project_name: pairflix

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/pairflix
    binary: pairflix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yohang/pairflix/internal/cli.version={{ .Version }}
      - -X github.com/yohang/pairflix/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/yohang/pairflix/internal/cli.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: deb
    package_name: pairflix
    formats: [deb]
    maintainer: Yohan Giarelli <yohan@les-tilleuls.coop>
    homepage: https://github.com/yohang/pairflix
    description: |-
      Stream video from torrents while they download.
      A peerflix equivalent written in Go: serves an HTTP video stream with
      Range/seek support, plays directly in VLC and casts to Chromecast.
    license: GPL-3.0
    section: utils
    priority: optional
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pairflix/copyright

  # Meta package (no binary): systemd service running `pairflix webserver`.
  - id: webserver-deb
    package_name: pairflix-webserver
    formats: [deb]
    meta: true
    file_name_template: "{{ .PackageName }}_{{ .Version }}_all"
    maintainer: Yohan Giarelli <yohan@les-tilleuls.coop>
    homepage: https://github.com/yohang/pairflix
    description: |-
      Run the pairflix web interface as a systemd service.
      Serves the pairflix webserver mode as a daemon: a web page that
      streams submitted torrents and magnet links to the configured
      backend (Chromecast, VLC or a plain HTTP stream URL).
    license: GPL-3.0
    section: utils
    priority: optional
    dependencies:
      - pairflix
    contents:
      - src: packaging/pairflix-webserver.service
        dst: /usr/lib/systemd/system/pairflix-webserver.service
        file_info:
          mode: 0644
      - src: packaging/pairflix-webserver.default
        dst: /etc/default/pairflix-webserver
        type: config|noreplace
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/pairflix-webserver/copyright
    scripts:
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
      postremove: packaging/deb/postremove.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
